<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault</title>
<style>
  :root{
    --ink:#1b1f23;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --line:#d9d4c7;
    --brass:#8a6d3b;
    --brass-dark:#6e5730;
    --ok:#2e6b47;
    --err:#a3402f;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .wrap{
    width:100%;
    max-width:420px;
    padding:64px 20px 60px;
  }
  .mark{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:6px;
  }
  .mark .icon{
    width:22px;height:22px;
    flex:none;
    border:2px solid var(--brass);
    border-radius:3px;
    position:relative;
    margin-bottom:8px;
  }
  .mark .icon:before{
    content:"";
    position:absolute;
    left:50%;top:-8px;
    width:12px;height:10px;
    border:2px solid var(--brass);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    transform:translateX(-50%);
  }
  h1{
    font-size:26px;
    margin:0;
    font-weight:400;
    letter-spacing:0.2px;
  }
  .sub{
    color:#6b675e;
    font-size:14.5px;
    margin:4px 0 30px;
    line-height:1.5;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:26px;
  }
  label{
    display:block;
    font-size:12.5px;
    color:#4a4740;
    margin:0 0 6px;
    font-family:var(--mono);
  }
  input[type=password]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:2px;
    font-size:15px;
    font-family:var(--serif);
    background:var(--paper);
    color:var(--ink);
  }
  input:focus{
    outline:2px solid var(--brass);
    outline-offset:1px;
  }
  button{
    appearance:none;
    border:none;
    background:var(--brass);
    color:#fff;
    padding:12px 20px;
    font-size:15px;
    font-family:var(--serif);
    border-radius:2px;
    cursor:pointer;
    margin-top:16px;
    width:100%;
  }
  button:hover{background:var(--brass-dark);}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .msg{
    font-size:13.5px;
    margin-top:12px;
    line-height:1.5;
    font-family:var(--mono);
    display:none;
  }
  .msg.err{color:var(--err);display:block;}
  .msg.ok{color:var(--ok);display:block;}
  .fileinfo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 0 4px;
  }
  .fname{font-size:15px;}
  .fsize{
    font-family:var(--mono);
    font-size:11.5px;
    color:#8a8577;
    display:block;
    margin-top:2px;
  }
  .fine{
    font-size:12px;
    color:#8a8577;
    line-height:1.6;
    margin-top:20px;
    text-align:center;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ece7db;
      --paper:#17140f;
      --panel:#211d16;
      --line:#3a352a;
      --brass:#c9a45c;
      --brass-dark:#e0bd7d;
      --ok:#5fb387;
      --err:#e07862;
    }
    :root:not([data-theme="light"]) button{color:#17140f;}
  }
  :root[data-theme="dark"]{
    --ink:#ece7db;
    --paper:#17140f;
    --panel:#211d16;
    --line:#3a352a;
    --brass:#c9a45c;
    --brass-dark:#e0bd7d;
    --ok:#5fb387;
    --err:#e07862;
  }
  :root[data-theme="dark"] button{color:#17140f;}
</style>
</head>
<body>

<div class="wrap" id="gate">
  <div class="mark"><span class="icon"></span><h1>Vault</h1></div>
  <p class="sub">Enter the password to download the file.</p>
  <div class="panel">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="off" autofocus>
    <button id="unlockBtn">Unlock</button>
    <div id="gateMsg" class="msg err"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <div class="mark"><span class="icon"></span><h1>Vault</h1></div>
  <p class="sub">Unlocked. Your file is ready.</p>
  <div class="panel">
    <div class="fileinfo">
      <span><span class="fname" id="fname">project.zip</span>
      <span class="fsize" id="fsize">129.2 KB</span></span>
    </div>
    <button id="downloadBtn">Download</button>
    <div id="dlMsg" class="msg"></div>
  </div>
  <p class="fine">This page checks the password in your browser before revealing the download — treat it as a lock on the door, not a safe.</p>
</div>

  var gate = document.getElementById("gate");
  var app = document.getElementById("app");
  var pw = document.getElementById("pw");
  var gateMsg = document.getElementById("gateMsg");

  function tryUnlock(){
    if(pw.value === PASSWORD){
      gate.style.display = "none";
      app.style.display = "block";
    } else {
      gateMsg.textContent = "That password isn't right. Try again.";
      gateMsg.className = "msg err";
    }
  }

  document.getElementById("unlockBtn").addEventListener("click", tryUnlock);
  pw.addEventListener("keydown", function(e){ if(e.key === "Enter") tryUnlock(); });

  document.getElementById("downloadBtn").addEventListener("click", function(){
    var msg = document.getElementById("dlMsg");
    try{
      var byteChars = atob(FILE_B64);
      var byteNumbers = new Array(byteChars.length);
      for (var i = 0; i < byteChars.length; i++) {
        byteNumbers[i] = byteChars.charCodeAt(i);
      }
      var byteArray = new Uint8Array(byteNumbers);
      var blob = new Blob([byteArray], {type: "application/zip"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = FILE_NAME;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      msg.textContent = "Download started.";
      msg.className = "msg ok";
    }catch(e){
      msg.textContent = "Something went wrong preparing the download: " + e.message;
      msg.className = "msg err";
